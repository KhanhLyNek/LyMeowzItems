name: One-time full Java namespace migration — LyMeowzItem
# Historical one-time namespace migration is complete. Never rewrite
# master automatically on an unrelated push or during PR merges.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: one-time-item-namespace-migration
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout LyMeowzItem
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout migrated LyMeowzLib
        uses: actions/checkout@v4
        with:
          repository: KhanhLyNek/LyMeowzLib
          ref: master
          path: agarthalib
      - name: Check library has been fully migrated first
        run: |
          test "$(find agarthalib/src -name '*.java' | wc -l)" -ge 520
          test "$(find agarthalib/src -path '*/praya/*' -name '*.java' | wc -l)" -eq 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Migrate all Java packages and cross-library import references
        run: python3 ci/migrate_all_java_packages.py --apply
      - name: Build and publish corresponding LyMeowzLib to Maven local
        run: gradle -p agarthalib clean build publishToMavenLocal --no-daemon --console=plain
      - name: Compile LyMeowzItem and real Paper 26.3 fixtures
        run: |
          gradle clean build jarPaper26LiveProbe jarPaper26EssentialsFixture \
            jarPaper26ItemsAdderFixture jarPaper26OraxenFixture --no-daemon --console=plain
      - name: Boot production plugins on Paper 26.3 and run integration probes
        timeout-minutes: 9
        run: python3 .github/scripts/paper26_server_smoke.py
      - name: Verify source invariants and production JAR
        run: |
          python3 .github/scripts/check_legacy_logic.py
          python3 .github/scripts/check_paper26_jar_contents.py
      - name: Report candidate migration diff for manual review
        run: |
          git status --short
          git diff --stat
          git diff --binary > namespace-migration-review.patch
      - name: Upload migration diff without pushing master
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namespace-migration-review
          path: namespace-migration-review.patch
          if-no-files-found: warn
